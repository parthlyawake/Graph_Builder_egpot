 "from": "components/ext/connector/forwardconnector/package_test.go:TestMain", "to": "components/ext/exporter/prometheusexporter/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_458", "from": "components/ext/connector/forwardconnector/package_test.go:TestMain", "to": "components/ext/extension/basicauthextension/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_459", "from": "components/ext/connector/forwardconnector/package_test.go:TestMain", "to": "components/ext/extension/zpagesextension/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_460", "from": "components/ext/connector/forwardconnector/package_test.go:TestMain", "to": "components/ext/receiver/jaegerreceiver/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_461", "from": "components/ext/connector/forwardconnector/package_test.go:TestMain", "to": "components/extension/jaegerquery/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_462", "from": "components/ext/extension/zpagesextension/package_test.go:TestMain", "to": "external::testutils.VerifyGoLeaks", "label": "CALLS", "color": "#40c4ff", "width": 2, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_463", "from": "components/ext/extension/zpagesextension/package_test.go:TestMain", "to": "components/ext/receiver/jaegerreceiver/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_464", "from": "components/ext/extension/zpagesextension/package_test.go:TestMain", "to": "components/extension/jaegerquery/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_465", "from": "file::internal/storage/v2/grpc/package_test.go", "to": "internal/storage/v2/grpc/package_test.go:TestMain", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_466", "from": "module::github.com/jaegertracing/jaeger/internal/storage/v2/api/tracestore", "to": "module::github.com/jaegertracing/jaeger/internal/storage/v2/badger", "label": "UNKNOWN", "color": "#cccccc", "width": 1, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_467", "from": "internal/storage/v2/elasticsearch/factory_test.go:TestESStorageFactoryErr", "to": "external::require.ErrorContains", "label": "CALLS", "color": "#40c4ff", "width": 2, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}, {"id": "e_468", "from": "internal/storage/v1/badger/samplingstore/storage.go:SamplingStore.InsertThroughput", "to": "external::time.Now", "label": "CALLS", "color": "#40c4ff", "width": 2, "dashes": false, "font": {"size": 10, "color": "#666666", "align": "middle"}}];
    
    const nodes = new vis.DataSet(rawNodes);
    const edges = new vis.DataSet(rawEdges);
    
    const adj = {};
    rawNodes.forEach(n => adj[n.id] = []);
    rawEdges.forEach(e => {
        adj[e.from].push(e.to);
        adj[e.to].push(e.from);
    });

    const container = document.getElementById('mynetwork');
    const data = { nodes: nodes, edges: edges };
    const options = {
        nodes: { font: { color: '#333333' } },
        edges: { smooth: { type: 'continuous' } },
        physics: {
            barnesHut: { gravitationalConstant: -3000, centralGravity: 0.3, springLength: 150 },
            stabilization: { iterations: 200, fit: true }
        },
        interaction: { hover: true, tooltipDelay: 200, dragNodes: true }
    };
    
    const network = new vis.Network(container, data, options);
    
    // Disable physics after initial load to stop nodes from moving on their own
    network.once("stabilizationIterationsDone", function() {
        network.setOptions({ physics: false });
    });
    
    function applySearch() {
        const term = document.getElementById('rag-search').value.toLowerCase();
        const hops = parseInt(document.getElementById('hop-select').value);
        
        if (!term) return;
        
        let startNodes = rawNodes.filter(n => n.full_name.toLowerCase().includes(term) || n.repo.toLowerCase().includes(term) || n.file.toLowerCase().includes(term)).map(n => n.id);
        
        if (startNodes.length === 0) {
            alert("No nodes found matching keyword.");
            return;
        }
        
        highlightNodes(startNodes, hops);
    }
    
    function highlightNodes(startNodes, hops) {
        let visibleNodes = new Set(startNodes);
        let queue = [...startNodes];
        
        for(let h=0; h<hops; h++) {
            let nextQueue = [];
            queue.forEach(u => {
                adj[u].forEach(v => {
                    if (!visibleNodes.has(v)) {
                        visibleNodes.add(v);
                        nextQueue.push(v);
                    }
                });
            });
            queue = nextQueue;
        }
        
        // Use top-level opacity to correctly fade nodes
        const updateNodes = [];
        rawNodes.forEach(n => {
            if (visibleNodes.has(n.id)) {
                updateNodes.push({id: n.id, opacity: 1.0});
            } else {
                updateNodes.push({id: n.id, opacity: 0.1});
            }
        });
        nodes.update(updateNodes);
        
        // Hide edges not fully in the visible set
        const updateEdges = [];
        rawEdges.forEach(e => {
            if (visibleNodes.has(e.from) && visibleNodes.has(e.to)) {
                updateEdges.push({id: e.id, hidden: false});
            } else {
                updateEdges.push({id: e.id, hidden: true});
            }
        });
        edges.update(updateEdges);
        
        network.focus(startNodes[0], {scale: 1.2, animation: true});
    }
    
    function resetGraph() {
        document.getElementById('rag-search').value = "";
        
        const updateNodes = rawNodes.map(n => ({id: n.id, opacity: 1.0}));
        nodes.update(updateNodes);
        
        const updateEdges = rawEdges.map(e => ({id: e.id, hidden: false}));
        edges.update(updateEdges);
        
        network.fit({animation: true});
    }

    network.on("click", function (params) {
        if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            const nodeData = rawNodes.find(n => n.id === nodeId);
            
            const hops = parseInt(document.getElementById('hop-select').value);
            highlightNodes([nodeId], hops);
            
            let html = `
                <div class="info-item"><div class="info-label">Node ID</div><div class="info-value">${nodeData.id}</div></div>
                <div class="info-item"><div class="info-label">Symbol Name</div><div class="info-value">${nodeData.full_name}</div></div>
                <div class="info-item"><div class="info-label">Type</div><div class="info-value">${nodeData.node_type}</div></div>
                <div class="info-item"><div class="info-label">Repository/Module</div><div class="info-value">${nodeData.repo}</div></div>
                <div class="info-item"><div class="info-label">File</div><div class="info-value">${nodeData.file}</div></div>
            `;
            
            const connectedEdges = rawEdges.filter(e => e.from === nodeId || e.to === nodeId);
            html += `<div class="info-item"><div class="info-label">Connected Edges (${connectedEdges.length})</div><ul>`;
            connectedEdges.slice(0, 15).forEach(e => {
                const dir = e.from === nodeId ? 'OUT' : 'IN';
                const other = e.from === nodeId ? e.to : e.from;
                const otherNode = rawNodes.find(n => n.id === other);
                html += `<li style="font-size:12px"><b>${e.label}</b> [${dir}] to<br><i>${otherNode.label}</i></li>`;
            });
            if (connectedEdges.length > 15) html += `<li style="font-size:12px">...and ${connectedEdges.length - 15} more</li>`;
            html += `</ul></div>`;
            
            document.getElementById('node-details').innerHTML = html;
        } else {
            document.getElementById('node-details').innerHTML = "<p>Click on a node to view its detailed properties and connections.</p>";
            resetGraph();
        }
    });

</script>
