name: Graph Builder Integration

on:
  push:
    branches: [krishna]
  workflow_dispatch:

jobs:
  graph-builder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install graph-builder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile graph-builder source and tests
        run: |
          python -m compileall -q graft_ckg.py polyglot.py multi_repo.py graph_builder_bindings.py graph_builder_http.py language_adapters.py tests
      - name: Run graph-builder integration tests
        run: |
          python -m pytest -q tests/test_managed_grpc_review.py tests/test_http_review_resolution.py tests/test_contract_layer.py tests/test_dependency_resolution.py tests/test_multi_repo.py tests/test_polyglot_architecture.py tests/test_polyglot_integration.py tests/test_polyglot_spring_events.py tests/test_seven_language_smoke.py tests/test_language_adapters.py tests/test_verify_graph_accuracy.py
