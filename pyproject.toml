[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-ckg"
version = "1.0.0"
description = "Generalized Relational Abstraction and Functional Topology for Code Knowledge Graphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Krishna S N" },
    { name = "Vikas Ranjan" },
]
keywords = [
    "code-knowledge-graph",
    "graph-rag",
    "llm-agent-context",
    "program-analysis",
    "polyglot",
    "microservices",
    "grpc",
    "tree-sitter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "networkx>=3.0",
    "scikit-learn>=1.2.0",
    "pyvis>=0.3.2",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.23,<0.24",
    "rank_bm25>=0.2",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
java = ["tree-sitter-java"]
csharp = ["tree-sitter-c-sharp"]
test = [
    "pytest>=7.0",
    "pypdf>=3.0",
]
all = [
    "tree-sitter-java",
    "tree-sitter-c-sharp",
    "pytest>=7.0",
    "pypdf>=3.0",
]

[project.scripts]
graft-ckg = "graft_ckg:main"
graft-traverse = "traversal:main"
graft-serve = "serve_ckg:main"
graft-export = "neo4j_export:_cli"
graft-retrieve = "hybrid_retrieval:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
